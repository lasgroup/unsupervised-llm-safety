# exp_configs/best_hyperparameters.yaml
# ============================================================================
# Per-(model, method) tuned hyperparameters: the values the paper reports.
#
# WHERE THESE COME FROM, AND WHICH SOURCE WINS
# --------------------------------------------
# THE PAPER IS AUTHORITATIVE. Every value below whose `source` says `paper`
# or `paper+code` is a cell of one of these tables/paragraphs:
#
#   Appendix "Hyperparameters" (\label{app:hyperparameters})
#     tab:hp-baselines-qwen        Qwen 1.5B      -> qwen2_1.5b
#     tab:hp-baselines-ministral   Ministral 8B   -> ministral_8b
#     tab:hp-baselines-llama3      LLaMA3 8B      -> llama3_8b
#     tab:hp-baselines-qwen3       Qwen3 8B       -> qwen3_8b
#     tab:hp-baselines-gpt         GPT-oss 20B    -> gpt_oss_20b
#     tab:hp-baselines-gemma       Gemma 4 26B    -> gemma4_26b
#     tab:hp-framework             FreqMask-KM N (clusters) and k (mask size)
#     "Stage 1 / Stage 2" paragraphs  LearnedMask-LoRA
#   Appendix "Ablations for LearnedMask-LoRA" (\label{app:learnedmask-lora-ablations})
#     its opening paragraph pins the LearnedMask configuration shared by every
#     run in that section.
#
# Values marked `source: code` are NOT stated in the paper. They are the
# values recorded in the `.hydra/overrides.yaml` of the run that produced the
# published number, and are kept because dropping them would silently change
# the published configuration.
#
# Values marked `source: paper+code` agree in both places.
#
# Where NEITHER source pins a value, there is no key here. The method YAML in
# exp_configs/anodet_algos/ supplies its own default and that is what runs.
#
# HOW THE VALUES ARE USED
# -----------------------
# `unsupervised_llm_safety.common.tuned_defaults.apply_tuned_defaults` is
# called by run_anodet_analysis before anything is fitted. Precedence is:
#
#   explicit command-line override  >  this file  >  the method YAML default
#
# so typing `anodet_algos.gmm.n_components=5` still gives you 5. Opt out of
# this file entirely with `anodet_algos.use_tuned_defaults=false`.
#
# Every application is logged with a `[tuned-defaults]` prefix, one line per
# key, saying whether the value came from here or was left to a CLI override.
#
# METHOD NAMING
# -------------
# The method keys below are *virtual algorithm names*. Several of them share a
# single Hydra config, because they are the same code driven into different
# regimes. `hydra_config` on each entry names the file in
# exp_configs/anodet_algos/ that `anodet_algos=<name>` loads.
#
#   paper name             virtual algorithm      hydra_config          run it with
#   ---------------------  ---------------------  --------------------  -----------------------------------
#   FreqMask-KM            cvdd_km_global_mask    cvdd_kmeans_masked    anodet_algos=cvdd_kmeans_masked
#   Local FreqMask-KM      local_freqmask_km      cvdd_kmeans_masked    ... anodet_algos.tuned_method=local_freqmask_km
#   FreqMask-KM, no mask   cvdd_km_no_mask        cvdd_kmeans_masked    ... anodet_algos.tuned_method=cvdd_km_no_mask
#   KMeans on raw acts.    cvdd_km_raw_no_mask    cvdd_kmeans_masked    ... anodet_algos.tuned_method=cvdd_km_raw_no_mask
#   CVDD (SAE space)       cvdd_sae               cvdd                  anodet_algos=cvdd anodet_algos.tuned_method=cvdd_sae
#   CVDD                   cvdd                   cvdd                  anodet_algos=cvdd
#   LearnedMask (stage 1)  learned_mask_step1     learned_mask          anodet_algos=learned_mask
#   LearnedMask-LoRA       learned_mask_lora      learned_mask_lora     anodet_algos=learned_mask_lora
#   Mahalanobis            mahalanobis            mahalanobis           anodet_algos=mahalanobis
#   GMM                    gmm                    gmm                   anodet_algos=gmm
#   One-Class SVM          one_class_svm          one_class_svm         anodet_algos=one_class_svm
#   Deep SVDD              deep_svdd              deep_svdd             anodet_algos=deep_svdd
#   BCE (linear probe)     bce                    bce                   anodet_algos=bce
#
# Each anodet_algos/*.yaml carries a `tuned_method:` key naming which of these
# it defaults to, so `anodet_algos=cvdd_kmeans_masked` gets FreqMask-KM without
# your having to know the virtual name. Override `tuned_method` for a variant.
#
# `params` keys are dotted paths relative to the `anodet_algos` config node,
# i.e. `gmm.n_components` here is `anodet_algos.gmm.n_components` on the CLI.
#
# `sae_variant` is metadata for the sweep orchestrator only -- it names which
# frozen SAE encoder the cell was tuned against and is turned into
# `anodet_algos.model_path` by scripts/anodet_algos/run_baseline_experiments.py.
# It is NEVER applied by apply_tuned_defaults: paths are resolved by the
# caller, not baked in here. Values:
#     <name>       -> <SAE root>/<model_key>__<name>.pth
#     null         -> model_path=null (the method never opens an encoder)
#     unreleased   -> this model's encoder was not archived; the orchestrator
#                     refuses to emit a command rather than guess a path
#     (key absent) -> the method takes no model_path at all
# ============================================================================

schema_version: 1

models:

  # ==========================================================================
  # Qwen 1.5B -- NOT released (activations and SAE encoder were not archived).
  # Recorded here because the paper pins these cells.
  # ==========================================================================
  qwen2_1.5b:
    paper_name: "Qwen 1.5B"
    released: false
    methods:

      mahalanobis:
        paper_name: Mahalanobis
        hydra_config: mahalanobis
        source: paper
        params:
          mahalanobis.regularization: 1.0e-5
          mahalanobis.score_type: sigmoid

      gmm:
        paper_name: GMM
        hydra_config: gmm
        source: paper
        params:
          gmm.n_components: 50
          gmm.init_method: "kmeans++"
          gmm.score_normalization: percentile

      one_class_svm:
        paper_name: One-Class SVM
        hydra_config: one_class_svm
        source: paper
        params:
          one_class_svm.nu: 0.01
          one_class_svm.gamma: 0.01
          one_class_svm.kernel: rbf

      deep_svdd:
        paper_name: Deep SVDD
        hydra_config: deep_svdd
        source: paper
        params:
          deep_svdd.rep_dim: 128
          deep_svdd.nu: 0.2
          deep_svdd.lr: 1.0e-3

      cvdd:
        paper_name: CVDD
        hydra_config: cvdd
        source: paper
        sae_variant: null
        params:
          cvdd.n_contexts: 500
          cvdd.ortho_weight: 1.0e-3
          cvdd.use_pretrained_encoder: false

      cvdd_km_global_mask:
        paper_name: FreqMask-KM
        hydra_config: cvdd_kmeans_masked
        source: paper
        sae_variant: unreleased
        note: >-
          N and k from tab:hp-framework. The appendix ablation prose
          (app:freq-abl-K) says this model's sweep peaked at N=25, which
          contradicts the selection table's N=200. The selection table is the
          statement of what was used, so N=200 is recorded.
        params:
          cvdd_kmeans_masked.n_clusters: 200
          cvdd_kmeans_masked.k_mask: 100
          cvdd_kmeans_masked.global_mask: true
          cvdd_kmeans_masked.use_masking: true
          cvdd_kmeans_masked.mask_variant: top_k
          cvdd_kmeans_masked.distance_metric: l1
          cvdd_kmeans_masked.cluster_in_encoded_space: true
          cvdd_kmeans_masked.fixed_centers: true

      cvdd_km_no_mask:
        paper_name: "FreqMask-KM with the mask disabled"
        hydra_config: cvdd_kmeans_masked
        source: paper
        sae_variant: unreleased
        note: >-
          The paper's published no-mask cell (tab:mask-ablation, full sweep in
          tab:freq-abl-nomask) gives the no-mask condition its OWN best N
          rather than reusing the masked configuration's, so N here is that
          per-model best, not FreqMask-KM's N. The published sweep was N in
          {10, 25, 50, 100, 200, 500}; pass it as a --multirun axis to
          reproduce the whole row.
        params:
          cvdd_kmeans_masked.n_clusters: 200
          cvdd_kmeans_masked.use_masking: false
          cvdd_kmeans_masked.distance_metric: l1
          cvdd_kmeans_masked.cluster_in_encoded_space: true
          cvdd_kmeans_masked.fixed_centers: true

      learned_mask_step1:
        paper_name: LearnedMask (stage 1 only)
        hydra_config: learned_mask
        source: paper
        sae_variant: unreleased
        note: >-
          Stage 2 (LoRA) is disabled on this model: the paper reports the
          stage-1 checkpoint as the LearnedMask-LoRA cell because LoRA costs
          0.033 AUROC here.
        params:
          learned_mask.n_clusters: 100
          learned_mask.cluster_method: cosine_binary
          learned_mask.mask_type: binary_ste
          learned_mask.residual_norm: whitened
          learned_mask.shrinkage_alpha: 0.3
          learned_mask.logit_init: 0.5
          learned_mask.lambda_candidates:
            [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1]

